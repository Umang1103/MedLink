<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedLink{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('patient.lookup') }}"><span class="brand-icon" aria-hidden="true">✚</span>MedLink</a>
    {% if g.hpc %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline userbox">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span>{{ g.hpc.name }}</span>
      <button type="submit" class="link">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash {{ 'ok' if category == 'ok' }}" role="alert">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
